<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#27272a" stroke-width="4"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  <g stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Neural Nodes Ring -->
    <circle cx="256" cy="110" r="18" fill="#09090b" stroke="#06b6d4" stroke-width="14"/>
    <circle cx="390" cy="220" r="18" fill="#09090b" stroke="#06b6d4" stroke-width="14"/>
    <circle cx="340" cy="380" r="18" fill="#09090b" stroke="#06b6d4" stroke-width="14"/>
    <circle cx="172" cy="380" r="18" fill="#09090b" stroke="#06b6d4" stroke-width="14"/>
    <circle cx="122" cy="220" r="18" fill="#09090b" stroke="#06b6d4" stroke-width="14"/>
    <!-- Interconnecting Working Memory Synapses -->
    <line x1="256" y1="128" x2="376" y2="208" stroke="#0891b2" stroke-width="8"/>
    <line x1="390" y1="238" x2="340" y2="362" stroke="#0891b2" stroke-width="8"/>
    <line x1="340" y1="380" x2="172" y2="380" stroke="#0891b2" stroke-width="8"/>
    <line x1="172" y1="362" x2="122" y2="238" stroke="#0891b2" stroke-width="8"/>
    <line x1="122" y1="208" x2="242" y2="128" stroke="#0891b2" stroke-width="8"/>
    <!-- Central Executive Core Node -->
    <circle cx="256" cy="256" r="32" fill="#06b6d4" stroke="#ffffff" stroke-width="8"/>
    <!-- Connections to Core -->
    <line x1="256" y1="128" x2="256" y2="224" stroke="#22d3ee" stroke-width="10"/>
    <line x1="376" y1="226" x2="288" y2="256" stroke="#22d3ee" stroke-width="10"/>
    <line x1="326" y1="366" x2="276" y2="282" stroke="#22d3ee" stroke-width="10"/>
    <line x1="186" y1="366" x2="236" y2="282" stroke="#22d3ee" stroke-width="10"/>
    <line x1="136" y1="226" x2="224" y2="256" stroke="#22d3ee" stroke-width="10"/>
  </g>
</svg>
